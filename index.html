<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lab &amp; Drug Formatter</title>
<style>
* { box-sizing: border-box; }
body { margin: 0; height: 100vh; height: 100dvh; display: flex; flex-direction: column; background: #f8f9fa; color: #333; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
.tabs { --accent: #667eea; --focus: #764ba2; display: flex; gap: 8px; padding: 12px 20px; background: white; border-bottom: 1px solid #e1e5e9; }
.tabs button { padding: 10px 18px; border: 1px solid #dce0e7; border-radius: 8px; background: #f8f9fa; color: #555; font: inherit; cursor: pointer; }
.tabs button:hover { border-color: var(--accent); }
.tabs button[aria-selected="true"] { background: var(--accent); border-color: var(--accent); color: white; }
.tabs button:focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; }
.tabs.drug-active { --accent: #347faa; --focus: #258577; }
.panel { flex: 1; min-height: 0; }
iframe { display: block; width: 100%; height: 100%; border: 0; }
[hidden] { display: none !important; }
@media (max-width: 600px) { .tabs { padding: 10px 8px; } .tabs button { flex: 1; padding: 10px 8px; font-size: 14px; } }
</style>
</head>
<body>
<nav class="tabs" role="tablist" aria-label="Formatters">
  <button id="lab-tab" type="button" role="tab" aria-selected="true" aria-controls="lab-panel">Lab Data Formatter</button>
  <button id="drug-tab" type="button" role="tab" aria-selected="false" aria-controls="drug-panel" tabindex="-1">Drug Formatter</button>
</nav>
<section id="lab-panel" class="panel" role="tabpanel" aria-labelledby="lab-tab">
  <iframe src="lab-data-formatter.html" title="Lab Data Formatter" allow="clipboard-write"></iframe>
</section>
<section id="drug-panel" class="panel" role="tabpanel" aria-labelledby="drug-tab" hidden>
  <iframe src="drug-formatter-2.html" title="Drug Formatter" allow="clipboard-write"></iframe>
</section>
<script>
const tabs = [...document.querySelectorAll('[role="tab"]')];
function activateTab(active) {
  document.querySelector('.tabs').classList.toggle('drug-active', active.id === 'drug-tab');
  tabs.forEach(tab => {
    const selected = tab === active;
    tab.setAttribute('aria-selected', String(selected));
    tab.tabIndex = selected ? 0 : -1;
    document.getElementById(tab.getAttribute('aria-controls')).hidden = !selected;
  });
}
tabs.forEach((tab, index) => {
  tab.addEventListener('click', () => activateTab(tab));
  tab.addEventListener('keydown', event => {
    let next;
    if (event.key === 'ArrowRight') next = (index + 1) % tabs.length;
    else if (event.key === 'ArrowLeft') next = (index + tabs.length - 1) % tabs.length;
    else if (event.key === 'Home') next = 0;
    else if (event.key === 'End') next = tabs.length - 1;
    else return;
    event.preventDefault();
    activateTab(tabs[next]);
    tabs[next].focus();
  });
});
</script>
</body>
</html>
